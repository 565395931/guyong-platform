# ============================================================
# Redis - Docker Compose
# ============================================================
# 用途：BullMQ 队列后端、配置缓存、WebSocket 状态存储
#
# 常用命令（在 docker/redis/ 目录下执行）：
#   启动：    docker compose up -d
#   查看状态：docker compose ps
#   查看日志：docker compose logs -f
#   停止：    docker compose stop
#   停止并删除容器：docker compose down
#   连接 CLI：docker exec -it rag-redis redis-cli
# ============================================================

services:
  redis:
    image: redis:7-alpine
    container_name: rag-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    # BullMQ requires queued jobs not to be evicted under memory pressure.
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy noeviction
    networks:
      - redis-network

volumes:
  redis-data:

networks:
  redis-network:
    driver: bridge
