server {
    listen 80;
    listen [::]:80;
    server_name wecom.lonely-warrior.online;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name wecom.lonely-warrior.online;

    ssl_certificate /etc/letsencrypt/live/wecom.lonely-warrior.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wecom.lonely-warrior.online/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    location /webhooks/wecom/ {
        proxy_pass http://127.0.0.1:8788;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        return 404;
    }
}
